[project]
name = "surveillance"
version = "0.1.0"
description = "A2 — Trade Surveillance Agent: grounded insider-trading investigation over SEC Form 4 data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "pandas>=2.2",
    "httpx>=0.27",
    "pandas-market-calendars>=5.4",
    "truststore>=0.9",
    "zarreh-agentkit",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
    "types-requests",
    "respx>=0.23",
    "pandas-stubs>=2.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-glightbox>=0.4",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surveillance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "data", "evals", "tests"]

[[tool.mypy.overrides]]
module = "pandas_market_calendars.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_package = "surveillance"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layering: api -> graph -> {agents,chains,tools,guardrails,retrieval} -> schemas/settings"
type = "layers"
layers = [
    "surveillance.api",
    "surveillance.graph",
    "surveillance.tools",
    "surveillance.schemas",
]

[[tool.importlinter.contracts]]
name = "chains never import nodes"
type = "forbidden"
source_modules = ["surveillance.graph.chains"]
forbidden_modules = ["surveillance.graph.nodes"]

[[tool.importlinter.contracts]]
name = "tools never import graph"
type = "forbidden"
source_modules = ["surveillance.tools"]
forbidden_modules = ["surveillance.graph"]

[[tool.importlinter.contracts]]
name = "no DSPy or DeepEval outside evals/optimize"
type = "forbidden"
source_modules = ["surveillance"]
forbidden_modules = ["dspy", "deepeval"]

[tool.uv.sources]
zarreh-agentkit = { git = "ssh://git@github.com/zarreh/zarreh_agentkit.git", branch = "main" }
